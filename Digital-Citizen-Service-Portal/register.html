<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Registration</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            <i class="fa-solid fa-landmark"></i>
            <span>Digital Citizen</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="track.html">Track Application</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Registration -->

    <section class="form-page">

        <div class="form-container">

            <div class="form-header">

                <div class="form-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h1>Create Citizen Account</h1>

                <p>
                    Register to access digital citizen services.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-row">

                    <div class="input-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="input-group">

                        <label>Mobile Number</label>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Enter mobile number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label>Address</label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="input-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                    </div>

                </div>


                <div id="registerMessage"></div>


                <button
                    type="submit"
                    class="form-submit"
                >
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>


                <p class="form-footer-text">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </form>

        </div>

    </section>


    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 Digital Citizen Service Portal
            </p>

            <p>
                Academic Project – Not an Official Government Portal
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
